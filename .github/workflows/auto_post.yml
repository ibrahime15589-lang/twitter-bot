name: Auto Growth Bot

on:
  schedule:
    # Her gün TR saatiyle 10:00, 15:00 ve 20:00'de çalışır (UTC ayarlı)
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kütüphaneleri kur
        run: pip install tweepy

      - name: Trend fikirleri üret (günde 1 kez, saat 10'da veya manuel çalıştırmada)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * *'
        run: |
          cd twitter-bot 2>/dev/null || cd "twitter bot" 2>/dev/null || true
          python trend_finder.py

      - name: Sıradaki fikri paylaş
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          cd twitter-bot 2>/dev/null || cd "twitter bot" 2>/dev/null || true
          python poster.py

      - name: Değişiklikleri kaydet
        run: |
          cd twitter-bot 2>/dev/null || cd "twitter bot" 2>/dev/null || true
          git config user.name "growth-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content_ideas.json 2>/dev/null || git add .
          git commit -m "auto: update content queue" || echo "değişiklik yok"
          git push
